name: Build INNOVA CHEAT

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Show runner info
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/checkout@v4

      # Cache DerivedData của Xcode để giảm thời gian build
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/com.apple.dt.Xcode
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('AppNew/ThreeOneOSFive.xcodeproj/project.pbxproj', 'AppNew/ThreeOneOSFive/**/*.swift', 'AppNew/ThreeOneOSFive/**/*.m', 'AppNew/ThreeOneOSFive/**/*.c', 'AppNew/ThreeOneOSFive/**/*.h', 'AppNew/ThreeOneOSFive/Info.plist') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      # Kiểm tra hoặc tạo AppBranding.swift nếu có script tools
      - name: Verify AppBranding.swift
        run: |
          set -euo pipefail
          BRAND_FILE="AppNew/ThreeOneOSFive/helpers/AppBranding.swift"

          if [ -f "tools/gen_branding.py" ]; then
            echo "Running tools/gen_branding.py..."
            python3 tools/gen_branding.py --out-dir AppNew/ThreeOneOSFive/helpers
          fi

          if [ ! -s "$BRAND_FILE" ]; then
            echo "::error::AppBranding.swift was not found or is empty"
            exit 1
          fi

          echo "AppBranding.swift OK ($(wc -c < "$BRAND_FILE") bytes)"

      # Nhúng mã hóa Assembly-CSharp-patch.bytes vào mã nguồn Swift Mach-O binary
      - name: Generate EmbeddedPatchData.swift
        run: |
          set -euo pipefail
          if [ -f "tools/embed_patch.py" ]; then
            echo "Running tools/embed_patch.py..."
            python3 tools/embed_patch.py
          fi
          PATCH_SWIFT="AppNew/ThreeOneOSFive/helpers/EmbeddedPatchData.swift"
          if [ ! -s "$PATCH_SWIFT" ]; then
            echo "::error::EmbeddedPatchData.swift was not found or is empty"
            exit 1
          fi
          echo "EmbeddedPatchData.swift OK ($(wc -c < "$PATCH_SWIFT") bytes)"

      # Build archive (universal iOS, không sign — dùng cho TrollStore/sideload)
      - name: Build archive
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project AppNew/ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/INNOVA CHEAT.xcarchive" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive

      # Đóng gói IPA từ .app trong xcarchive
      - name: Package IPA
        id: package
        run: |
          set -euo pipefail
          APP_DIR=$(find "build/INNOVA CHEAT.xcarchive/Products/Applications" -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
            echo "::error::App bundle not found. Available products:"
            ls -la "build/INNOVA CHEAT.xcarchive/Products/Applications/" || true
            exit 1
          fi

          echo "Found App bundle at: $APP_DIR"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -r "$APP_DIR" build/ipa/Payload/

          cd build/ipa
          zip -qr "INNOVA CHEAT.ipa" Payload
          cd "$GITHUB_WORKSPACE"

          # Verify cấu trúc IPA hợp lệ
          unzip -l "build/ipa/INNOVA CHEAT.ipa" | head -30
          unzip -l "build/ipa/INNOVA CHEAT.ipa" | grep -q "Payload/.*\.app/Info.plist" \
            || { echo "::error::Invalid IPA structure - Info.plist missing"; exit 1; }

          # Kiểm tra bảo mật: Đảm bảo Assembly-CSharp-patch.bytes và localConfig.json KHÔNG xuất hiện rời rạc trong IPA
          if unzip -l "build/ipa/INNOVA CHEAT.ipa" | grep -q "Assembly-CSharp-patch.bytes"; then
            echo "::error::Assembly-CSharp-patch.bytes is still exposed in IPA!"
            exit 1
          else
            echo "🔒 SUCCESS: Assembly-CSharp-patch.bytes is completely hidden from IPA (embedded in binary)"
          fi

          if unzip -l "build/ipa/INNOVA CHEAT.ipa" | grep -q "localConfig.json"; then
            echo "::error::localConfig.json is still exposed in IPA!"
            exit 1
          else
            echo "🔒 SUCCESS: localConfig.json is completely hidden from IPA (embedded in binary)"
          fi

          IPA_SIZE=$(stat -f%z "build/ipa/INNOVA CHEAT.ipa" 2>/dev/null || stat -c%s "build/ipa/INNOVA CHEAT.ipa")
          echo "IPA size: $IPA_SIZE bytes"
          echo "ipa_path=build/ipa/INNOVA CHEAT.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: INNOVA-CHEAT-ipa
          path: "build/ipa/INNOVA CHEAT.ipa"
          if-no-files-found: error
          retention-days: 14

      - name: Inspect binary
        if: always()
        run: |
          APP_DIR=$(find build/INNOVACHEAT.xcarchive/Products/Applications -name "*.app" -maxdepth 1 2>/dev/null | head -1 || true)
          if [ -n "$APP_DIR" ] && [ -d "$APP_DIR" ]; then
            echo "=== App bundle size ==="
            du -sh "$APP_DIR"
            EXEC_NAME=$(basename "$APP_DIR" .app)
            echo "=== Mach-O architectures ($EXEC_NAME) ==="
            lipo -info "$APP_DIR/$EXEC_NAME" 2>/dev/null || true
            echo "=== Linked frameworks ($EXEC_NAME) ==="
            otool -L "$APP_DIR/$EXEC_NAME" 2>/dev/null | head -20 || true
          fi
